<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarIQ — Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-card {
      background: var(--secondary);
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-logo  { text-align:center; font-size:2.5rem; margin-bottom:0.5rem; }
    .auth-title { text-align:center; font-size:1.4rem; font-weight:700; margin-bottom:0.3rem; }
    .auth-sub   { text-align:center; color:var(--muted); font-size:0.85rem; margin-bottom:2rem; }
    .attempt-bar { display:flex; gap:6px; margin-bottom:1rem; justify-content:center; }
    .attempt-dot { width:28px; height:6px; border-radius:3px; background:var(--success); transition:background 0.3s; }
    .attempt-dot.used { background:var(--error); }
    .auth-footer { text-align:center; margin-top:1.5rem; font-size:0.85rem; color:var(--muted); }
    .auth-footer a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
<nav>
  <a class="nav-brand" href="home.html">🚗 CarIQ</a>
  <ul class="nav-links">
    <li><a href="home.html">Home</a></li>
    <li><a href="login.html" class="active">Login</a></li>
    <li><a href="register.html">Register</a></li>
  </ul>
</nav>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🚗</div>
    <div class="auth-title">Welcome to CarIQ</div>
    <div class="auth-sub">Sign in to access the dashboard</div>
    <div class="attempt-bar" id="attempt-bar">
      <div class="attempt-dot" id="dot-1"></div>
      <div class="attempt-dot" id="dot-2"></div>
      <div class="attempt-dot" id="dot-3"></div>
      <div class="attempt-dot" id="dot-4"></div>
      <div class="attempt-dot" id="dot-5"></div>
    </div>
    <div class="form-group" style="margin-bottom:1rem;">
      <label for="login-email">Email Address</label>
      <input id="login-email" type="email" placeholder="uday@cariq.com">
    </div>
    <div class="form-group" style="margin-bottom:1.5rem;">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="••••••••">
    </div>
    <div id="login-alert" class="alert"></div>
    <button class="btn btn-primary" id="login-btn"
            data-label="Sign In" style="width:100%;">Sign In</button>
    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one →</a>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script>
  let attemptsUsed = 0;
  const MAX = 5;

  function updateDots(used) {
    for (let i = 1; i <= MAX; i++) {
      const dot = document.getElementById('dot-' + i);
      dot.className = i <= used ? 'attempt-dot used' : 'attempt-dot';
    }
  }

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email    = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    if (!email || !password) {
      showAlert('login-alert', 'Please enter email and password', 'error');
      return;
    }
    setLoading('login-btn', true);
    try {
      // ✅ CHANGED: Uses the API variable from app.js instead of hardcoded localhost
      const res  = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('cariq_token', data.token);
        localStorage.setItem('cariq_user',  JSON.stringify(data.user));
        showAlert('login-alert', 'Welcome back! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'home.html', 1000);
      } else {
        attemptsUsed = MAX - (data.remaining ?? 0);
        updateDots(attemptsUsed);
        showAlert('login-alert', data.error, 'error');
        if (data.locked) {
          document.getElementById('login-btn').disabled = true;
          document.getElementById('login-btn').textContent = 'Locked';
        }
      }
    } catch(err) {
      showAlert('login-alert', 'Server unreachable.', 'error');
    } finally {
      setLoading('login-btn', false);
    }
  });

  document.getElementById('login-password')
    .addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
</script>
</body>
</html>
